<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 160 160" width="160" height="160">
  <defs>
    <filter id="jntukGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="2" stdDeviation="3" flood-color="#059669" flood-opacity="0.25"/>
    </filter>
  </defs>
  <!-- Outer green ring -->
  <circle cx="80" cy="80" r="74" fill="#FFFFFF" stroke="#047857" stroke-width="6" filter="url(#jntukGlow)"/>
  <circle cx="80" cy="80" r="66" fill="#FFFFFF" stroke="#065F46" stroke-width="1.8" stroke-dasharray="3,3"/>
  <circle cx="80" cy="80" r="48" fill="#ECFDF5" stroke="#059669" stroke-width="2"/>
  
  <!-- Outer Circular Text Ring Simulation -->
  <path id="textCircle" d="M 80,18 A 62,62 0 1,1 79.9,18" fill="none"/>
  <text font-family="'Inter', sans-serif" font-size="7.5" font-weight="800" fill="#065F46" letter-spacing="1.2">
    <textPath href="#textCircle" startOffset="50%" text-anchor="middle">
      JAWAHARLAL NEHRU TECHNOLOGICAL UNIVERSITY KAKINADA
    </textPath>
  </text>
  
  <!-- Center Lotus Emblem & Flame -->
  <g transform="translate(80,82)">
    <!-- Base Petals / Leaves -->
    <path d="M-28,12 C-15,4 -8,12 0,16 C8,12 15,4 28,12 C18,22 -18,22 -28,12 Z" fill="#047857"/>
    <path d="M-22,6 C-12,0 -5,8 0,11 C5,8 12,0 22,6 C14,15 -14,15 -22,6 Z" fill="#10B981"/>
    <!-- Center Red Rose Emblem matching authentic JNTUK crest in Target Image 1 -->
    <path d="M0,-24 C-10,-10 -12,2 0,10 C12,2 10,-10 0,-24 Z" fill="#DC2626"/>
    <path d="M-14,-14 C-20,-2 -14,6 0,8 C-8,4 -10,-4 -14,-14 Z" fill="#B91C1C"/>
    <path d="M14,-14 C20,-2 14,6 0,8 C8,4 10,-4 14,-14 Z" fill="#B91C1C"/>
    <path d="M-7,-20 C-12,-10 -6,0 0,6 C-4,1 -6,-6 -7,-20 Z" fill="#EF4444"/>
    <path d="M7,-20 C12,-10 6,0 0,6 C4,1 6,-6 7,-20 Z" fill="#EF4444"/>
    <!-- Cogwheel / Gear Teeth behind -->
    <circle cx="0" cy="0" r="6" fill="#FDBA12"/>
    <circle cx="0" cy="0" r="3" fill="#991B1B"/>
  </g>
</svg>
