      <feDropShadow dx="0" dy="2" stdDeviation="3" flood-color="#1E293B" flood-opacity="0.15"/>
    </filter>
  </defs>
  <circle cx="80" cy="80" r="74" fill="#FFFFFF" stroke="#E2E8F0" stroke-width="4" filter="url(#otherGlow)"/>
  <circle cx="80" cy="80" r="64" fill="#F8FAFC"/>
