    <rect x="-32" y="-7" width="8" height="28" rx="2" fill="#1E293B"/>
    <rect x="-14" y="-7" width="8" height="28" rx="2" fill="#1E293B"/>
    <rect x="6" y="-7" width="8" height="28" rx="2" fill="#1E293B"/>
    <rect x="24" y="-7" width="8" height="28" rx="2" fill="#1E293B"/>
    <!-- Base plinth -->
    <rect x="-42" y="23" width="84" height="6" rx="2" fill="#334155"/>
    <rect x="-46" y="30" width="92" height="6" rx="2" fill="#1E293B"/>
