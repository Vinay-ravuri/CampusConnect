<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 160 160" width="160" height="160">
  <defs>
    <filter id="jntuhGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="2" stdDeviation="3" flood-color="#7C3AED" flood-opacity="0.25"/>
    </filter>
  </defs>
  <!-- Outer purple ring -->
  <circle cx="80" cy="80" r="74" fill="#FFFFFF" stroke="#6D28D9" stroke-width="6" filter="url(#jntuhGlow)"/>
  <circle cx="80" cy="80" r="66" fill="#FFFFFF" stroke="#5B21B6" stroke-width="1.8" stroke-dasharray="3,3"/>
  <circle cx="80" cy="80" r="48" fill="#F5F3FF" stroke="#7C3AED" stroke-width="2"/>
  
  <!-- Outer Circular Text Ring -->
  <path id="jntuhTextCircle" d="M 80,18 A 62,62 0 1,1 79.9,18" fill="none"/>
  <text font-family="'Inter', sans-serif" font-size="7.5" font-weight="800" fill="#5B21B6" letter-spacing="1.2">
    <textPath href="#jntuhTextCircle" startOffset="50%" text-anchor="middle">
      JNTU HYDERABAD • KUKATPALLY
    </textPath>
  </text>
  
  <!-- Center Technical & Torch Emblem -->
  <g transform="translate(80,82)">
    <!-- Tech Cog -->
    <circle cx="0" cy="-6" r="22" fill="#EDE9FE" stroke="#6D28D9" stroke-width="2.5"/>
    <!-- Rose / Floral Emblem matching Target Image 1 -->
    <path d="M0,-24 C-10,-14 -12,-4 0,4 C12,-4 10,-14 0,-24 Z" fill="#E11D48"/>
    <path d="M-14,-16 C-18,-6 -12,2 0,4 C-6,0 -8,-8 -14,-16 Z" fill="#DB2777"/>
    <path d="M14,-16 C18,-6 12,2 0,4 C6,0 8,-8 14,-16 Z" fill="#DB2777"/>
    <path d="M-7,-20 C-10,-12 -4,-4 0,0 C-3,-4 -5,-10 -7,-20 Z" fill="#F43F5E"/>
    <path d="M7,-20 C10,-12 4,-4 0,0 C3,-4 5,-10 7,-20 Z" fill="#F43F5E"/>
    <!-- Center Core -->
    <circle cx="0" cy="-4" r="5" fill="#F59E0B"/>
  </g>

  <!-- Bottom JNTUH Banner matching Target Image 1 -->
  <g transform="translate(80, 134)">
    <rect x="-38" y="-12" width="76" height="20" rx="6" fill="#1D4ED8" stroke="#1E40AF" stroke-width="1.5" filter="url(#jntuhGlow)"/>
    <text x="0" y="3" font-family="'Inter', 'Space Grotesk', sans-serif" font-size="12" font-weight="900" fill="#FFFFFF" text-anchor="middle" letter-spacing="1">
      JNTUH
    </text>
  </g>
</svg>
