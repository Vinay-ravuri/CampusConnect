# Dedicated H2 Offline/Test Development Profile
# Activated via: -Dspring-boot.run.profiles=h2

spring:
  datasource:
    url: jdbc:h2:file:./data/campusconnectdb;DB_CLOSE_DELAY=-1;MODE=PostgreSQL
    username: sa
    password: 
    driver-class-name: org.h2.Driver

  jpa:
    database-platform: org.hibernate.dialect.H2Dialect
    hibernate:
      ddl-auto: update # Automatically syncs schema changes alongside Flyway migrations
    show-sql: false

  flyway:
    enabled: true
    baseline-on-migrate: true
    locations: classpath:db/migration

  h2:
    console:
      enabled: true
      path: /h2-console
